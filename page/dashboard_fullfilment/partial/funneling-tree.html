<div class="container-fluid">

<h5 class="mb-4">
<button class="btn btn-primary">
<i class="fa fa-project-diagram"></i> FUNNELING ORDER
</button>
</h5>

<!-- FILTER AREA -->

<div class="card shadow-sm mb-4">
<div class="card-body">

<div class="row">

<div class="col-md-3">
<label class="form-label">HSA</label>
<select id="filterHSA" class="form-select">
<option value="">ALL HSA</option>
</select>
</div>

<div class="col-md-3">
<label class="form-label">STO</label>
<select id="filterSTO" class="form-select">
<option value="">ALL STO</option>
</select>
</div>

<div class="col-md-3">
<label class="form-label">Start Date</label>
<input type="date" id="startDate" class="form-control">
</div>

<div class="col-md-3">
<label class="form-label">End Date</label>
<input type="date" id="endDate" class="form-control">
</div>

</div>

<div class="row mt-3">

<div class="col-md-12 text-end">
<button class="btn btn-success" onclick="applyFilter()">
<i class="fa fa-filter"></i> Apply Filter
</button>
</div>

</div>

</div>
</div>

<!-- DIAGRAM AREA -->

<div class="card shadow-sm">
<div class="card-body">

<div id="funnel-container">

<div class="node purple" id="input">
INPUT ORDER
<div class="count" id="inputCount">0</div>
</div>

<div class="node yellow" id="pi">
PI
<div class="count" id="piCount">0</div>
</div>

<div class="node yellow" id="startwork">
STARTWORK
<div class="count" id="startCount">0</div>
</div>

<div class="node blue" id="inprogress">
INPROGRESS
<div class="count" id="progressCount">0</div>
</div>

<div class="node green" id="complete">
COMPWORK
<div class="count" id="completeCount">0</div>
</div>

<div class="node red" id="cancel">
CANCEL
<div class="count" id="cancelCount">0</div>
</div>

<div class="node orange" id="workfail">
WORKFAIL
<div class="count" id="failCount">0</div>
</div>

</div>

</div>
</div>

</div>
