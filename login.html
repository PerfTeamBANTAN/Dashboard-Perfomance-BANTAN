<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Corporate Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:"Poppins", sans-serif;
}

body{
  margin:0;
  height:100vh;
  background:#f5f6fa;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:1100px;
  height:600px;
  background:#fff;
  display:flex;
  border-radius:15px;
  box-shadow:0 15px 40px rgba(0,0,0,.15);
  overflow:hidden;
}

/* LEFT SIDE */
.left{
  flex:1;
  background:#fafafa;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
}
.left img{
  width:90%;
}

/* RIGHT SIDE */
.right{
  flex:1;
  padding:40px 60px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.logo{
  text-align:center;
  margin-bottom:20px;
}
.logo img{
  width:120px;
}
.logo h2{
  margin:10px 0 5px;
}
.logo p{
  color:#e63946;
  font-weight:500;
}

.form-group{
  margin-top:15px;
}
.form-group label{
  font-size:14px;
}
.form-group input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:5px;
  outline:none;
}
.form-group input:focus{
  border-color:#e63946;
}

.remember{
  margin-top:15px;
  font-size:14px;
}

button{
  margin-top:25px;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#e63946;
  color:white;
  font-size:16px;
  cursor:pointer;
}
button:hover{
  background:#c62828;
}

#error{
  margin-top:10px;
  color:red;
  text-align:center;
}

.footer{
  text-align:center;
  font-size:12px;
  margin-top:20px;
  color:#888;
}

/* Responsive */
@media(max-width:900px){
  .container{
    flex-direction:column;
    height:auto;
  }
  .left{
    display:none;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- LEFT ILLUSTRATION -->
  <div class="left">
    <img src="https://cdn-icons-png.flaticon.com/512/4202/4202843.png">
  </div>

  <!-- RIGHT LOGIN FORM -->
  <div class="right">

    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo_Telkom_Indonesia_2013.png">
      <h2>LENSA FLOW</h2>
      <p>Flexible Order and Workforce System</p>
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter your username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>

    <div class="remember">
      <input type="checkbox" id="remember"> Remember Me
    </div>

    <button onclick="login()">Log In</button>

    <p id="error"></p>

    <div class="footer">
      © 2026 Company Internal System
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script>
  // ===== CEK JIKA SUDAH LOGIN =====
  if(localStorage.getItem("user")){
    window.location.href = "index.html";
  }

  function login(){
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const remember = document.getElementById("remember").checked;

    if(username === "" || password === ""){
      document.getElementById("error").innerText = "Username dan password harus diisi!";
      return;
    }

    document.getElementById("error").innerText = "Loading...";

    sendRequest("login","login",{username,password})
      .then(data=>{
        if(data.status === "success"){
          // simpan user
          if(remember){
            localStorage.setItem("user", data.user);
          }else{
            sessionStorage.setItem("user", data.user);
          }

          window.location.href = "index.html";
        }else{
          document.getElementById("error").innerText = "Username atau password salah!";
        }
      })
      .catch(err=>{
        console.error(err);
        document.getElementById("error").innerText = "Server tidak dapat dihubungi!";
      });
  }
</script>

</body>
</html>
