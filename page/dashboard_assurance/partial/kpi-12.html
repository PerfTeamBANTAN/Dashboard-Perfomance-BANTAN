<div id="kpi12-container" class="kpi12-wrapper">

  <!-- Header KPI -->
  <div class="kpi12-header d-flex flex-wrap align-items-center justify-content-between mb-3">
    <div>
      <h3 class="kpi12-title mb-1">
        KPI 12PI Laten TANGERANG Branch Telkomsel
      </h3>
      <p class="kpi12-subtitle mb-0">
        Performance Indikator Laten – Monitoring harian per kategori & area
      </p>
    </div>
    <div class="kpi12-meta text-end">
      <div class="kpi12-badge">Live Update</div>
      <div class="kpi12-update" id="kpi12-last-update">Loading...</div>
    </div>
  </div>

  <!-- Filter & Info Bar -->
  <div class="kpi12-toolbar d-flex flex-wrap align-items-center justify-content-between mb-3">
    <div class="d-flex flex-wrap align-items-center gap-2">
      <span class="kpi12-label">Filter:</span>
      <select id="kpi12-filter-segmen" class="form-select form-select-sm kpi12-select">
        <option value="ALL" selected>All Segmen</option>
      </select>
      <select id="kpi12-filter-area" class="form-select form-select-sm kpi12-select">
        <option value="ALL" selected>All Area</option>
      </select>
    </div>
    <button id="kpi12-refresh" class="btn btn-sm btn-primary">
      <i class="fa fa-rotate-right me-1"></i> Refresh Data
    </button>
  </div>

  <!-- Summary Cards -->
  <div class="row g-3 mb-3" id="kpi12-summary-row">
    <!-- Cards akan di-inject via JS -->
  </div>

  <!-- Detail Cards -->
  <div class="kpi12-card-grid" id="kpi12-card-grid">
    <!-- Cards detail per baris data -->
  </div>

  <!-- Loading & Error -->
  <div id="kpi12-loading" class="kpi12-loading text-center mt-4">
    <div class="spinner-border"></div>
    <div class="mt-2">Loading KPI 12PI Laten...</div>
  </div>
  <div id="kpi12-error" class="kpi12-error alert alert-danger d-none mt-3">
    Gagal memuat data KPI 12PI Laten. Silakan coba lagi.
  </div>

</div>
