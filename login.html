<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

html, body {
  width: 100vw;
  height: 100vh;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

/* DESKTOP: form di kanan (sedikit geser, tidak mentok) */
body {
  background: url("assets/home/login.png") no-repeat center center;
  background-size: cover;
  background-attachment: scroll;
  display: flex;
  justify-content: flex-end;     /* ➜ dorong ke kanan */
  align-items: center;
  min-height: 100vh;
  position: relative;
  padding-right: 300px;           /* atur seberapa jauh dari tepi kanan */
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
}

/* PANEL LOGIN – FIX WIDTH */
.login-box {
  position: relative;
  width: 520px;
  max-width: 90vw;
  max-height: 90vh;
  padding: 30px 35px;
  margin: 0;

  background: rgba(30,30,30,0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  box-shadow:
    0 0 25px rgba(255,0,0,0.25),
    inset 0 0 10px rgba(255,255,255,0.05);
  overflow-y: auto;
  z-index: 1;
}

/* LOGO */
.logo {
  text-align: center;
  margin-bottom: 25px;
  padding: 10px 0;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo img {
  width: 100%;
  height: 100%;
  max-height: 210px;
  object-fit: contain;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
}

/* INPUT */
.form-group {
  margin-top: 20px;
  position: relative;
}

.form-group i {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #ccc;
}

.form-group input {
  width: 100%;
  padding: 12px 12px 12px 45px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.25);
  color: #fff;
  outline: none;
  font-size: 15px;
}

.form-group input::placeholder {
  color: #ccc;
}

.form-group input:focus {
  border-color: #ff4d4d;
  box-shadow: 0 0 5px rgba(255,77,77,.6);
}

/* BUTTON */
button {
  margin-top: 25px;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #e60000;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: .3s;
  box-shadow: 0 0 15px rgba(255,0,0,.5);
  width: 100%;
}

button:hover {
  background: #b30000;
}

/* REMEMBER */
.remember {
  margin-top: 15px;
  font-size: 13px;
  color: #ddd;
  display: flex;
  align-items: center;
  gap: 8px;
}

.remember input {
  accent-color: #ff4d4d;
  cursor: pointer;
  transform: scale(1.1);
}

#error {
  margin-top: 10px;
  color: #ff6b6b;
  text-align: center;
  font-size: 14px;
}

.footer {
  margin-top: 25px;
  text-align: center;
  font-size: 12px;
  color: #ccc;
}

/* MOBILE ≤768px: form di tengah */
@media (max-width: 768px) {
  body {
    justify-content: center;    /* ➜ mobile tengah */
    align-items: center;
    padding: 10px;
    background-size: contain;
    background-position: top center;
  }

  .login-box {
    width: 95vw;
    max-width: 95vw;
  }

  .logo {
    height: 160px;
  }

  .logo img {
    max-height: 150px;
  }
}

/* TABLET 769–1024px: form di tengah */
@media (min-width: 769px) and (max-width: 1024px) {
  body {
    justify-content: center;
    padding: 10px 20px;
  }

  .login-box {
    width: 70vw;
    max-width: 700px;
  }
}

</style>

</head>

<body>
<div class="login-box">
  <div class="logo">
    <img src="assets/home/logo2.png" alt="Logo" loading="lazy">
  </div>

  <div class="form-group">
    <i class="fa fa-user"></i>
    <input type="text" id="username" placeholder="Username" data-testid="username-input">
  </div>

  <div class="form-group">
    <i class="fa fa-lock"></i>
    <input type="password" id="password" placeholder="Password" data-testid="password-input">
  </div>

  <button onclick="login()">LOGIN</button>

  <div class="remember">
    <input type="checkbox" id="remember">
    <label for="remember">Remember Me</label>
  </div>

  <p id="error"></p>

  <div class="footer">
    © 2026 Performance Team
  </div>
</div>

<script src="js/api.js"></script>
<script>
if (localStorage.getItem("user")) {
  window.location.href = "index.html";
}

function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const remember = document.getElementById("remember").checked;

  if (username === "" || password === "") {
    document.getElementById("error").innerText = "Username dan password harus diisi!";
    return;
  }

  if (!remember) {
    document.getElementById("error").innerText = "Silakan centang Remember Me terlebih dahulu!";
    return;
  }

  document.getElementById("error").innerText = "Loading...";

  sendRequest("login", "login", { username, password })
    .then(data => {
      if (data.status === "success") {
        localStorage.setItem("user", data.user);
        window.location.href = "index.html";
      } else {
        document.getElementById("error").innerText = "Username atau password salah!";
      }
    })
    .catch(() => {
      document.getElementById("error").innerText = "Server tidak dapat dihubungi!";
    });
}
</script>
</body>
</html>
