<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Corporate Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{
  box-sizing:border-box;
  font-family:"Poppins", sans-serif;
}
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
}
.login-container{
  background:#fff;
  width:380px;
  padding:35px;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}
.logo{
  text-align:center;
  margin-bottom:20px;
}
.logo img{
  width:70px;
}
.logo h2{
  margin:10px 0 0;
  color:#2c5364;
}
.input-group{
  margin-top:20px;
}
.input-group label{
  font-size:13px;
  color:#555;
}
.input-group input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  outline:none;
  margin-top:5px;
  transition:.3s;
}
.input-group input:focus{
  border-color:#2c5364;
  box-shadow:0 0 5px rgba(44,83,100,.4);
}
.btn-login{
  width:100%;
  padding:12px;
  margin-top:25px;
  border:none;
  border-radius:8px;
  background:#2c5364;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}
.btn-login:hover{
  background:#203a43;
}
.footer-text{
  margin-top:15px;
  text-align:center;
  font-size:12px;
  color:#888;
}
#error{
  color:red;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="login-container">

  <div class="logo">
    <!-- Ganti logo perusahaan -->
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <h2>Company Portal</h2>
    <p style="font-size:13px;color:#777;">Internal System Login</p>
  </div>

  <div class="input-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Masukkan username">
  </div>

  <div class="input-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Masukkan password">
  </div>

  <button class="btn-login" onclick="login()">Sign In</button>

  <p id="error"></p>

  <div class="footer-text">
    © 2026 Company Name. All rights reserved.
  </div>

</div>

<script src="js/api.js"></script>
<script>
function login(){
  const username=document.getElementById("username").value;
  const password=document.getElementById("password").value;

  sendRequest("login","login",{username,password})
  .then(data=>{
    if(data.status==="success"){
      localStorage.setItem("user",data.user);
      window.location.href="dashboard.html";
    } else {
      document.getElementById("error").innerText="Username atau password salah!";
    }
  });
}
</script>

</body>
</html>
