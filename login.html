<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  font-family:"Poppins", sans-serif;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body{
  background: url("assets/home/login.png") no-repeat center center fixed;
  background-size: cover;
  display:flex;
  justify-content:flex-start;   /* mulai dari kiri */
  align-items:center;
  padding-left:280px;           /* geser form ke kiri */
  position:relative;
}
  
/* overlay */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.4);
}

/* PANEL TRANSPARAN */
.login-box{
  position:relative;
  width:420px;
  height:520px;

  background:rgba(30,30,30,0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius:15px;
  border:1px solid rgba(255,255,255,0.15);
  padding:40px 35px;
  color:#fff;

  box-shadow:
    0 0 25px rgba(255,0,0,0.25),
    inset 0 0 10px rgba(255,255,255,0.05);
}


/* LOGO */
.logo{
  text-align:center;
  margin-bottom:25px;
}
.logo img{
  width:120px;
}
.logo h2{
  margin:10px 0 5px;
}
.logo p{
  color:#ff4d4d;
  font-size:14px;
}

/* INPUT */
.form-group{
  margin-top:20px;
  position:relative;
}
.form-group i{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#ccc;
}
.form-group input{
  width:100%;
  padding:12px 12px 12px 45px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(0,0,0,0.25);
  color:#fff;
  outline:none;
}
.form-group input::placeholder{
  color:#ccc;
}
.form-group input:focus{
  border-color:#ff4d4d;
  box-shadow:0 0 5px rgba(255,77,77,.6);
}

/* BUTTON */
button{
  margin-top:25px;
  padding:14px;
  border:none;
  border-radius:8px;
  background:#e60000;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 0 15px rgba(255,0,0,.5);
}
button:hover{
  background:#b30000;
}

/* REMEMBER */
.remember{
  margin-top:15px;
  font-size:13px;
  color:#ddd;
  display:flex;
  align-items:center;
  gap:8px;
}
.remember input{
  accent-color:#ff4d4d;
  cursor:pointer;
}

#error{
  margin-top:10px;
  color:#ff6b6b;
  text-align:center;
}

.footer{
  margin-top:25px;
  text-align:center;
  font-size:12px;
  color:#ccc;
}

/* RESPONSIVE */
@media(max-width:768px){
  body{
    justify-content:center;
    padding-left:0;
  }
  .login-box{
    width:90%;
  }
}

</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo_Telkom_Indonesia_2013.png">
    <h2>PERFORMANCE XXX</h2>
    <p>Dashboard Monitoring Performance</p>
  </div>

  <div class="form-group">
    <i class="fa fa-user"></i>
    <input type="text" id="username" placeholder="Username">
  </div>

  <div class="form-group">
    <i class="fa fa-lock"></i>
    <input type="password" id="password" placeholder="Password">
  </div>

  <button onclick="login()">LOGIN</button>

  <div class="remember">
    <input type="checkbox" id="remember">
    <label for="remember"> Remember Me</label>
  </div>

  <p id="error"></p>

  <div class="footer">
    © 2026 Performance Team
  </div>

</div>

<script src="js/api.js"></script>
<script>
if(localStorage.getItem("user")){
  window.location.href="index.html";
}

function login(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const remember = document.getElementById("remember").checked;

  if(username==="" || password===""){
    document.getElementById("error").innerText="Username dan password harus diisi!";
    return;
  }

  document.getElementById("error").innerText="Loading...";

  sendRequest("login","login",{username,password})
    .then(data=>{
      if(data.status==="success"){
        if(remember){
          localStorage.setItem("user", data.user);
        }else{
          sessionStorage.setItem("user", data.user);
        }
        window.location.href="index.html";
      }else{
        document.getElementById("error").innerText="Username atau password salah!";
      }
    })
    .catch(()=>{
      document.getElementById("error").innerText="Server tidak dapat dihubungi!";
    });
}
</script>

</body>
</html>
