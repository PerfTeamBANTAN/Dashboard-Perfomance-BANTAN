<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  font-family:"Poppins", sans-serif;
}

body{
  margin:0;
  height:100vh;
  background:url("bg-login.jpg") no-repeat center center/cover;
  display:flex;
  justify-content:flex-end;
  align-items:center;
}

/* overlay gelap */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}

.login-box{
  position:relative;
  width:420px;
  height:100vh;
  background:rgba(20,20,20,0.85);
  padding:50px 40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  color:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  margin-bottom:30px;
}
.logo img{
  width:120px;
}
.logo h2{
  margin:10px 0;
}
.logo p{
  color:#ff4d4d;
  font-size:14px;
}

/* INPUT */
.form-group{
  margin-top:20px;
  position:relative;
}
.form-group i{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#aaa;
}
.form-group input{
  width:100%;
  padding:12px 12px 12px 45px;
  border-radius:8px;
  border:none;
  background:#222;
  color:#fff;
  outline:none;
}
.form-group input::placeholder{
  color:#aaa;
}
.form-group input:focus{
  border:1px solid #ff4d4d;
}

/* BUTTON */
button{
  margin-top:25px;
  padding:14px;
  border:none;
  border-radius:8px;
  background:#e60000;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  background:#b30000;
}

.forgot{
  text-align:center;
  margin-top:15px;
}
.forgot a{
  color:#ccc;
  font-size:13px;
  text-decoration:none;
}
.forgot a:hover{
  text-decoration:underline;
}

#error{
  margin-top:10px;
  color:#ff4d4d;
  text-align:center;
}

.footer{
  margin-top:30px;
  text-align:center;
  font-size:12px;
  color:#aaa;
}

/* Responsive */
@media(max-width:768px){
  .login-box{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo_Telkom_Indonesia_2013.png">
    <h2>PERFORMANCE XXX</h2>
    <p>Dashboard Monitoring Performance</p>
  </div>

  <div class="form-group">
    <i class="fa fa-user"></i>
    <input type="text" id="username" placeholder="Username">
  </div>

  <div class="form-group">
    <i class="fa fa-lock"></i>
    <input type="password" id="password" placeholder="Password">
  </div>

  <button onclick="login()">LOGIN</button>

  <div class="forgot">
    <a href="#">Forgot Password?</a>
  </div>

  <p id="error"></p>

  <div class="footer">
    © 2026 Performance Team
  </div>

</div>

<script src="js/api.js"></script>
<script>
if(localStorage.getItem("user")){
  window.location.href="index.html";
}

function login(){
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();

  if(username===""||password===""){
    document.getElementById("error").innerText="Username dan password harus diisi!";
    return;
  }

  document.getElementById("error").innerText="Loading...";

  sendRequest("login","login",{username,password})
    .then(data=>{
      if(data.status==="success"){
        localStorage.setItem("user",data.user);
        window.location.href="index.html";
      }else{
        document.getElementById("error").innerText="Username atau password salah!";
      }
    })
    .catch(()=>{
      document.getElementById("error").innerText="Server tidak dapat dihubungi!";
    });
}
</script>

</body>
</html>
